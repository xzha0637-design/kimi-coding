<h1>QA质量保障 On-Call SOP</h1>
<p>文档编号：SOP-009 | 版本：v3.0 | 最后更新：2026-03-01</p>
<p>适用范围：QA质量保障团队全体值班人员，覆盖功能测试、性能测试、自动化测试平台</p>
</header>
<main>
<h2>五、禁止操作</h2>
<h3>五、禁止操作</h3>
<p>以下操作严格禁止：一、在生产环境执行测试脚本或发送测试请求；二、使用真实用户数据作为测试数据而未经脱敏；三、在未确认修复效果的情况下签署发布审批；四、手动修改自动化测试的执行结果以通过流水线检查；五、删除测试环境的历史数据而不通知相关团队；六、在性能测试期间对被测环境进行配置变更；七、绕过代码审查流程直接合并测试代码到主分支。</p>
</main>
</body>
