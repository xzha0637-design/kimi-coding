<main>
<h2>三、常见故障处理</h2>
<h3>场景六：第三方接口故障</h3>
<p>当依赖的外部第三方接口出现超时或错误率升高时，首先确认是否为第三方服务自身故障，可通过其官方状态页面或直接联系对方技术支持确认。在确认第三方故障后，启用本地缓存兜底策略或降级方案。对于支付类接口，切换到备用支付通道。对于短信通道，切换到备用供应商。所有第三方接口都应有超时设置和重试机制，重试次数不超过三次，避免雪崩效应。</p>
</main>
