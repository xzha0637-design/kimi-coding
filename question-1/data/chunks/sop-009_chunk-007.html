<p>文档编号：SOP-009 | 版本：v3.0 | 最后更新：2026-03-01</p>
<p>适用范围：QA质量保障团队全体值班人员，覆盖功能测试、性能测试、自动化测试平台</p>
</header>
<main>
<h2>四、升级流程</h2>
<h3>四、升级流程</h3>
<p>QA值班遇到以下情况需升级：一、测试环境不可用超过四小时且影响多个团队；二、自动化测试平台完全瘫痪；三、发现已上线版本存在严重质量问题（数据错误、资金安全）；四、测试数据泄露涉及真实用户信息。升级路径：值班QA到QA团队负责人到质量VP。对于已上线的质量问题，需同时通知相关业务线的开发负责人。</p>
</main>
