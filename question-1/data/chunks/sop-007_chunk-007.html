<p>文档编号：SOP-007 | 版本：v2.6 | 最后更新：2026-02-25</p>
<p>适用范围：移动客户端团队全体值班人员，覆盖iOS、Android、Flutter跨平台</p>
</header>
<main>
<h2>四、升级流程</h2>
<h3>四、升级流程</h3>
<p>移动客户端值班遇到以下情况需升级：一、新版本崩溃率超过百分之一；二、核心功能（登录、支付、首页加载）完全不可用；三、发现安全漏洞（如数据明文传输、本地存储泄露）；四、应用被商店下架。升级路径：值班移动工程师到移动端技术负责人到客户端VP。由于移动端修复周期较长（需要发版和审核），P0级问题需在十分钟内升级。</p>
</main>
