<header>
<h1>网络&amp;CDN On-Call SOP</h1>
<p>文档编号：SOP-010 | 版本：v4.0 | 最后更新：2026-03-12</p>
<p>适用范围：网络&amp;CDN团队全体值班人员,覆盖骨干网络&amp;CDN加速&amp;DNS服务&amp;负载均衡</p>
</header>
<main>
<h2>五.禁止操作</h2>
<h3>五.禁止操作</h3>
<p>以下操作严格禁止:一&amp;在业务高峰期变更核心交换机或路由器配置;二&amp;未经确认直接修改生产DNS记录;三&amp;在未通知业务方的情况下刷新CDN全部缓存;四&amp;手动修改BGP路由宣告而不通知上下游;五&amp;在生产LB上直接测试新配置;六&amp;关闭DDoS防护服务进行所谓的"性能测试";七&amp;使用未授权的网络扫描工具对生产网络进行扫描.</p>
</main>
</body>
</html>
