<h1>数据平台 On-Call SOP</h1>
<p>文档编号：SOP-006 | 版本：v3.5 | 最后更新：2026-02-28</p>
<p>适用范围：数据平台团队全体值班人员，覆盖数据仓库、实时计算、数据治理</p>
</header>
<main>
<h2>四、升级流程</h2>
<h3>四、升级流程</h3>
<p>数据平台值班遇到以下情况需升级：一、核心报表数据延迟超过两小时；二、数据丢失或数据错误已影响业务决策；三、Hadoop或Flink集群核心组件完全不可用；四、大规模数据安全事件。升级路径：值班数据工程师到数据平台负责人到数据VP。核心报表通常在每日早晨九点前供业务方使用，因此凌晨的任务故障需在六点前升级处理。</p>
</main>
