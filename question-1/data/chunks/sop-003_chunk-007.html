<h1>前端Web On-Call SOP</h1>
<p>文档编号：SOP-003 | 版本：v2.8 | 最后更新：2026-02-15</p>
<p>适用范围：前端Web团队全体值班人员，覆盖PC端&amp;移动端H5&amp;小程序WebView</p>
</header>
<main>
<h2>四、升级流程</h2>
<h3>四、升级流程</h3>
<p>前端值班遇到以下情况需升级：一、核心页面(首页、商品详情、下单页、支付页)全量白屏;二、JS错误率超过百分之一且持续上升;三、用户数据泄露风险(如XSS漏洞被利用);四、SEO核心页面无法被爬虫正常抓取。升级路径：值班前端→前端技术负责人→技术总监。P0故障需在五分钟内升级,同时在故障群内同步信息。</p>
</main>
