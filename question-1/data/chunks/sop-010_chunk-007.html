<header>
<h1>网络&amp;CDN On-Call SOP</h1>
<p>文档编号：SOP-010 | 版本：v4.0 | 最后更新：2026-03-12</p>
<p>适用范围：网络&amp;CDN团队全体值班人员,覆盖骨干网络&amp;CDN加速&amp;DNS服务&amp;负载均衡</p>
</header>
<main>
<h2>四.升级流程</h2>
<h3>四.升级流程</h3>
<p>网络&amp;CDN值班遇到以下情况需立即升级:一&amp;核心机房网络完全中断;二&amp;DNS全局解析故障;三&amp;CDN大面积节点故障影响超过百分之三十的用户;四&amp;大规模DDoS攻击超过防护带宽.升级路径:值班网络工程师→网络团队负责人→基础架构VP.网络故障通常是P0级别,因为几乎所有服务都依赖网络,需在三分钟内升级.</p>
</main>
