<h1>移动客户端 On-Call SOP</h1>
<p>文档编号：SOP-007 | 版本：v2.6 | 最后更新：2026-02-25</p>
<p>适用范围：移动客户端团队全体值班人员，覆盖iOS、Android、Flutter跨平台</p>
</header>
<main>
<h2>五、禁止操作</h2>
<h3>五、禁止操作</h3>
<p>以下操作严格禁止：一、未经灰度直接全量发布新版本；二、在正式版中保留调试日志输出；三、硬编码API密钥或Token到客户端代码中；四、在线上版本中开启性能分析工具；五、未经安全审查使用新的第三方SDK；六、在热修复补丁中修改核心支付逻辑；七、绕过应用商店分发未签名的安装包。</p>
</main>
</body>
