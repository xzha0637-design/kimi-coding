<h2>五、禁止操作</h2>
<h3>五、禁止操作</h3>
<p>以下操作严格禁止：一、未经AB实验验证直接全量上线新模型；二、在GPU集群上运行个人训练任务占用在线推理资源；三、修改在线特征的计算逻辑而不通知下游模型方；四、删除模型版本的历史Checkpoint文件；五、在生产环境开启模型的Debug日志（会严重影响推理性能）；六、未经安全审查部署使用外部预训练权重的模型；七、手动修改AB实验的流量分配而不通知实验负责人。</p>
</main>
