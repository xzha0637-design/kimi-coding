<p>文档编号：SOP-001 | 版本：v3.2 | 最后更新：2026-03-01</p>
<p>适用范围：后端服务团队全体值班人员</p>
</header>
<main>
<h2>五、禁止操作</h2>
<h3>五、禁止操作</h3>
<p>以下操作在值班期间严格禁止：一、未经审批直接在生产环境执行数据库DDL操作；二、在故障处理期间同时进行代码发布；三、直接修改生产环境的配置文件而不通过配置中心；四、在未通知团队的情况下重启核心服务；五、删除生产环境的日志文件或数据；六、使用root权限执行不明确的脚本；七、在高峰期进行扩缩容操作。所有生产变更操作必须遵循变更管理流程，值班期间仅允许执行经过审批的紧急变更。</p>
</main>
</body>
</html>
