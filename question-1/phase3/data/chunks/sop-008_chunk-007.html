<main>
<h2>四、升级流程</h2>
<h3>四、升级流程</h3>
<p>AI算法值班遇到以下情况需升级：一、核心推荐或搜索服务完全不可用；二、模型效果指标下降超过百分之二十且持续一小时以上；三、GPU集群大面积故障；四、模型安全问题（如模型被注入恶意内容）。升级路径：值班算法工程师到AI平台负责人到算法VP。效果类问题的升级需附带详细的数据分析报告。</p>
</main>
